name: Release userscripts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.16.1
        with:
          cache: true
          node-version: "24"
          run-install: false

      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test

      - name: Build secret-free release artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          export RELEASE_VERSION
          (cd apps/imdb-sonarr && vp build --mode release)
          (cd apps/imdb-radarr && vp build --mode release)
          (cd apps/plex && vp build --mode release)
          mkdir release
          cp apps/imdb-sonarr/dist/imdb-sonarr.user.js release/imdb-sonarr.user.js
          cp apps/imdb-radarr/dist/imdb-radarr.user.js release/imdb-radarr.user.js
          cp apps/plex/dist/plex.user.js release/plex.user.js
          node tooling/verify-release.mjs "$RELEASE_VERSION" \
            release/imdb-sonarr.user.js release/imdb-radarr.user.js release/plex.user.js
          sha256sum release/imdb-sonarr.user.js release/imdb-radarr.user.js release/plex.user.js > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes
